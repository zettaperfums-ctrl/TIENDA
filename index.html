<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZETTA PERFUM'S - L'Essence de l'Invisible</title>
    <!-- Estilos CSS integrados -->
    <style>
        :root {
            --neon-cyan: #00f2fe;
            --neon-fuchsia: #ff007f;
            --bg-deep: #0a0a0c;
            --text-light: #f5f5f7;
            --card-bg: rgba(18, 18, 22, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* FONDO DE HUMO NEÓN CON MOVIMIENTO LENTO Y FLUIDO */
        body {
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(rgba(10, 10, 12, 0.75), rgba(10, 10, 12, 0.85)), 
                url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000&auto=format&fit=crop');
            background-size: 150% 150%;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            padding-bottom: 90px;
            scroll-behavior: smooth;
            animation: smokeMovement 20s ease-in-out infinite alternate;
        }

        /* Animación sutil de desplazamiento del humo */
        @keyframes smokeMovement {
            0% { background-position: 0% 30%; }
            50% { background-position: 100% 70%; }
            100% { background-position: 40% 10%; }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(10, 10, 12, 0.9);
            border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-container {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            font-weight: bold;
            color: var(--neon-cyan);
        }

        h1 {
            font-size: 1.2rem;
            color: var(--text-light);
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-fuchsia));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cart-btn {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--text-light);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .store-banner {
            text-align: center;
            padding: 25px 20px;
        }

        .store-banner h2 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-fuchsia));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .store-banner p {
            color: #a1a1a6;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .categories-bar {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .category-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--neon-cyan);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 242, 254, 0.2);
        }

        .catalog-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: var(--text-light);
        }

        .product-info .price {
            font-size: 1.2rem;
            color: var(--neon-cyan);
            font-weight: bold;
            margin: 10px 0;
        }

        .product-info p {
            font-size: 0.85rem;
            color: #c7c7cc;
            line-height: 1.4;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-view, .btn-add {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            border: none;
        }

        .btn-view {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-add {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-fuchsia));
            color: #000;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
        }

        /* BOTÓN FLOTANTE ASESOR IA */
        .ai-assistant-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-fuchsia));
            color: #000;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            z-index: 99;
            border: none;
        }
    </style>
</head>
<body>

    <!-- CABECERA -->
    <header>
        <div class="logo-area">
            <div class="logo-container">ZP</div>
            <h1>ZETTA PERFUM'S</h1>
        </div>
        <button class="cart-btn">
            🛒 Carrito <span style="background:var(--neon-fuchsia); padding: 2px 6px; border-radius: 50%; font-size: 0.75rem;">0</span>
        </button>
    </header>

    <!-- BANNER PRINCIPAL -->
    <section class="store-banner">
        <h2>ZETTA Perfum's</h2>
        <p>L'Essence de l'Invisible</p>
    </section>

    <!-- CATEGORÍAS -->
    <div class="categories-bar">
        <div class="category-chip" style="border-color: var(--neon-fuchsia);">✨ Todos</div>
        <div class="category-chip">HOMBRE</div>
        <div class="category-chip">MUJER</div>
        <div class="category-chip">UNISEX</div>
        <div class="category-chip">ÁRABES</div>
    </div>

    <!-- CATÁLOGO DE PRODUCTOS -->
    <main class="catalog-container">
        <div class="product-card">
            <div class="product-info">
                <span style="font-size: 0.75rem; color: var(--neon-fuchsia); text-transform: uppercase; font-weight: bold;">Perfumes Árabes • Unisex</span>
                <h3>ARMAF ETER DESERT</h3>
                <div class="price">$125.000</div>
                <p>100ml huele a una combinación vibrante de frutas tropicales dulces, rosa elegante y un fondo cálido, especiado y de cuero.</p>
            </div>
            <div class="card-actions">
                <button class="btn-view">Ver</button>
                <button class="btn-add">Agregar</button>
            </div>
        </div>
    </main>

    <!-- BOTÓN ASESOR IA -->
    <button class="ai-assistant-btn">
        ✨ Asesor ZETTA
    </button>

</body>
</html>
