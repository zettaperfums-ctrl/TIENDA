<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZETTA PERFUM'S</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#00f2fe;--secondary:#ff007f;--bg-dark:#0a0a0c;--card-bg:#141418;--text-light:#f5f5f7;--text-muted:#a1a1a6;--border-color:#26262e;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background-color:var(--bg-dark);color:var(--text-light);padding-bottom:90px;scroll-behavior:smooth;}

iframe[src*="netlify"], a[href*="netlify.com/wt?utm_source"], div[style*="z-index: 2147483647"], img[alt*="Netlify"] {
  display: none !important;
  visibility: hidden !important;
  opacity: 0 !important;
  pointer-events: none !important;
  position: absolute !important;
  left: -9999px !important;
}

@keyframes neonFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes pulseLogo {
  0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 15px rgba(0,242,254,0.3); }
  50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 30px rgba(255,0,127,0.6); }
  100% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 15px rgba(0,242,254,0.3); }
}

/* PANTALLA DE CARGA INICIAL CON EL LOGO */
#splash-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--bg-dark);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

#splash-screen.fade-out {
  opacity: 0;
  visibility: hidden;
}

.splash-logo-container {
  width: 90px;
  height: 90px;
  border-radius: 20px;
  background: #16161c;
  border: 2px solid var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  animation: pulseLogo 2s infinite ease-in-out;
  margin-bottom: 1.2rem;
  box-shadow: 0 0 20px rgba(0,242,254,0.4);
}

.splash-logo-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.splash-text {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(45deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.5rem;
}

.splash-sub {
  font-size: 0.75rem;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

header{position:sticky;top:0;background:rgba(10,10,12,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-color);z-index:100;padding:0.7rem 1.2rem;display:flex;justify-content:space-between;align-items:center;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-icon{height:54px;width:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#16161c;border:1.5px solid var(--primary);box-shadow:0 0 12px rgba(0,242,254,0.4);}
.brand-icon img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-name{font-size:1.2rem;font-weight:700;letter-spacing:1.5px;background:linear-gradient(45deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.cart-btn{position:relative;background:transparent;border:1px solid var(--primary);color:var(--primary);padding:6px 14px;border-radius:20px;cursor:pointer;font-weight:600;box-shadow:0 0 10px rgba(0,242,254,0.2);}
.cart-badge{position:absolute;top:-8px;right:-8px;background:var(--secondary);color:#fff;font-size:0.75rem;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;}

.hero-banner{width:100%;background:radial-gradient(circle,rgba(20,20,30,1)0%,rgba(10,10,12,1)100%);padding:2.5rem 1rem 1.5rem 1rem;text-align:center;border-bottom:1px solid var(--border-color);display:flex;flex-direction:column;align-items:center;}
.hero-title{font-size:1.8rem;font-weight:700;margin-bottom:0.2rem;background:linear-gradient(45deg,#fff,var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-subtitle{color:var(--text-muted);font-size:0.85rem;letter-spacing:2px;text-transform:uppercase;}

.menu-container {
  max-width: 1200px;
  margin: 1rem auto 0.5rem auto;
  padding: 0 1rem;
  display: flex;
  justify-content: flex-start;
}

.menu-dropdown-wrapper {
  position: relative;
  display: inline-block;
}

.menu-toggle-btn {
  background: var(--card-bg);
  border: 1.5px solid var(--primary);
  color: var(--text-light);
  padding: 8px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 0 12px rgba(0,242,254,0.25);
  transition: 0.3s;
}

.menu-toggle-btn:hover { background: rgba(0,242,254,0.1); }

.categories-dropdown {
  display: none;
  position: absolute;
  top: 110%;
  left: 0;
  background: var(--card-bg);
  min-width: 200px;
  border: 1.5px solid var(--primary);
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.8);
  z-index: 90;
  overflow: hidden;
  flex-direction: column;
}

.categories-dropdown.show { display: flex; }

.cat-item-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 10px 16px;
  text-align: left;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 500;
  border-bottom: 1px solid var(--border-color);
  transition: 0.2s;
  width: 100%;
}

.cat-item-btn:last-child { border-bottom: none; }
.cat-item-btn:hover, .cat-item-btn.active {
  background: linear-gradient(270deg, var(--primary), var(--secondary), var(--primary));
  background-size: 200% 200%;
  animation: neonFlow 4s ease infinite;
  color: #fff;
  font-weight: 600;
}

.catalog-container{max-width:1200px;margin:0 auto;padding:1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.2rem;}

.product-card {
  background: var(--card-bg);
  border-radius: 20px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: all 0.3s ease;
  border: 2px solid transparent;
  background-image: linear-gradient(var(--card-bg), var(--card-bg)), linear-gradient(270deg, var(--primary), var(--secondary), var(--primary));
  background-size: 200% 200%;
  animation: neonFlow 6s ease infinite;
  background-origin: border-box;
  background-clip: padding-box, border-box;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
}

.product-card.highlight {
  transform: scale(1.03);
  box-shadow: 0 0 25px var(--primary);
  border-color: var(--primary);
}

.product-card:hover { transform: translateY(-5px); box-shadow: 0 0 25px rgba(0,242,254,0.4), 0 0 15px rgba(255, 0, 127, 0.3); }

.product-img-container{
  width: 100%;
  height: 250px;
  background: #16161c;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.product-img-container img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
}

.product-info{padding:1rem;display:flex;flex-direction:column;flex-grow:1;}
.product-meta-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.product-category{font-size:0.7rem;color:var(--primary);text-transform:uppercase;font-weight:700;}
.product-gender {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  background: linear-gradient(270deg, var(--primary), var(--secondary), var(--primary));
  background-size: 200% 200%;
  animation: neonFlow 4s ease infinite;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 1px;
}
.product-title{font-size:1rem;font-weight:600;margin-bottom:6px;}
.product-desc{font-size:0.8rem;color:var(--text-muted);margin-bottom:10px;flex-grow:1;}
.product-price{font-size:1.2rem;font-weight:700;color:var(--text-light);margin-bottom:12px;background:linear-gradient(45deg,#fff,var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.add-to-cart-btn{
  width:100%;
  background:linear-gradient(270deg,var(--primary),#00b4db,var(--secondary),var(--primary));
  background-size:300% 300%;
  animation:neonFlow 5s ease infinite;
  color:#000;
  border:none;
  padding:12px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
  font-size:0.95rem;
  box-shadow:0 0 15px rgba(0,242,254,0.3);
  transition:0.2s;
}
.add-to-cart-btn:hover {filter: brightness(1.1); box-shadow: 0 0 25px rgba(0,242,254,0.7);}

.cart-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;justify-content:flex-end;z-index:1000;}
.cart-overlay.open{display:flex;}
.cart-modal{width:100%;max-width:400px;background:var(--bg-dark);height:100%;display:flex;flex-direction:column;padding:1.2rem;border-left:1px solid var(--border-color);}
.cart-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-color);padding-bottom:0.8rem;}
.close-cart{background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer;}
.cart-items{flex-grow:1;overflow-y:auto;margin:1rem 0;display:flex;flex-direction:column;gap:0.8rem;}
.cart-item{display:flex;align-items:center;gap:10px;background:var(--card-bg);padding:8px;border-radius:8px;}
.cart-item-icon{font-size:1.5rem;width:45px;height:45px;background:#1e1e24;display:flex;align-items:center;justify-content:center;border-radius:4px;overflow:hidden;}
.cart-item-icon img{width:100%;height:100%;object-fit:contain;display:block;}
.cart-item-details{flex-grow:1;}
.cart-item-title{font-size:0.85rem;font-weight:600;}
.cart-item-price{font-size:0.8rem;color:var(--primary);}
.qty-controls{display:flex;align-items:center;gap:6px;margin-top:4px;}
.qty-btn{background:var(--border-color);color:#fff;border:none;width:20px;height:20px;border-radius:4px;cursor:pointer;}
.delete-item{color:#e74c3c;background:none;border:none;cursor:pointer;}
.cart-total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:700;margin-bottom:1rem;}
.checkout-form{display:flex;flex-direction:column;gap:8px;margin-bottom:0.8rem;}
.checkout-form input{background:var(--card-bg);border:1px solid var(--border-color);padding:10px;border-radius:6px;color:#fff;}
.send-whatsapp-btn{width:100%;background:#25d366;color:#fff;border:none;padding:12px;border-radius:6px;font-size:0.95rem;font-weight:700;cursor:pointer;}

.recommendations-btn{position:fixed;bottom:20px;right:15px;background:linear-gradient(270deg,var(--secondary),var(--primary),var(--secondary));background-size:200% 200%;animation:neonFlow 4s ease infinite;color:#fff;border:none;padding:10px 16px;border-radius:30px;font-weight:700;cursor:pointer;z-index:999;display:flex;align-items:center;gap:6px;font-size:0.85rem;box-shadow:0 4px 20px rgba(255,0,127,0.5);}
.chat-window{position:fixed;bottom:80px;right:20px;width:360px;max-width:90vw;height:500px;background:var(--bg-dark);border:1.5px solid var(--primary);border-radius:16px;display:none;flex-direction:column;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,0.8);}
.chat-window.active{display:flex;}
.chat-body{flex-grow:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;font-size:0.82rem;}
.msg{max-width:95%;padding:10px 14px;border-radius:12px;line-height:1.4;}
.msg-bot{background:var(--card-bg);color:#fff;align-self:flex-start;border:1.5px solid var(--primary);box-shadow:0 0 10px rgba(0,242,254,0.15);}
.msg-user{background:var(--primary);color:#000;font-weight:600;align-self:flex-end;}

.chat-product-card {background:#1a1a22;border:1px solid var(--primary);border-radius:10px;padding:8px;margin-top:8px;display:flex;gap:8px;align-items:center;}
.chat-product-card img, .chat-product-card .cp-icon {width:42px;height:42px;object-fit:contain;border-radius:6px;background:#111;display:flex;align-items:center;justify-content:center;font-size:1.3rem;}
.chat-product-info {flex-grow:1;}
.chat-product-info h4 {font-size:0.78rem;font-weight:600;color:#fff;}
.chat-product-info p {font-size:0.72rem;color:var(--primary);font-weight:700;}
.chat-card-actions {display:flex;gap:4px;}
.chat-card-actions button {border:none;padding:5px 8px;border-radius:5px;font-weight:bold;cursor:pointer;font-size:0.7rem;}
.btn-chat-view {background:var(--border-color);color:#fff;}
.btn-chat-add {background:var(--primary);color:#000;}

.chat-footer-box{padding:8px;background:var(--card-bg);display:flex;gap:6px;border-top:1px solid var(--border-color);}
.chat-input{flex-grow:1;background:var(--bg-dark);border:1px solid var(--border-color);padding:8px 12px;border-radius:16px;color:#fff;outline:none;}
.chat-send-btn{background:var(--primary);border:none;padding:0 14px;border-radius:16px;cursor:pointer;font-weight:bold;color:#000;}
</style>
</head>
<body>

<!-- PANTALLA DE CARGA CON EL LOGO -->
<div id="splash-screen">
  <div class="splash-logo-container">
    <img src="https://i.postimg.cc/02Dj1nhz/Logo.jpg" alt="Logo ZETTA">
  </div>
  <div class="splash-text">ZETTA PERFUM'S</div>
  <div class="splash-sub">Cargando experiencia...</div>
</div>

<header>
<div class="brand">
  <div class="brand-icon"><img src="https://i.postimg.cc/02Dj1nhz/Logo.jpg" alt="Logo ZETTA"></div>
  <span class="brand-name">ZETTA PERFUM'S</span>
</div>
<button class="cart-btn" onclick="toggleCart()"><i class="fa-solid fa-cart-shopping"></i> Carrito <span class="cart-badge" id="cart-count">0</span></button>
</header>

<section class="hero-banner">
<h1 class="hero-title">ZETTA Perfum's</h1>
<p class="hero-subtitle">L'ESSENCE DE L'INVISIBLE</p>
</section>

<div class="menu-container">
  <div class="menu-dropdown-wrapper">
    <button class="menu-toggle-btn" onclick="toggleCategoryMenu()">
      <i class="fa-solid fa-bars" style="color:var(--primary);"></i> Categorías <span id="current-cat-label" style="font-weight:normal; color:var(--text-muted); font-size:0.8rem;">(Todos)</span>
    </button>
    <div class="categories-dropdown" id="categories-dropdown"></div>
  </div>
</div>

<main class="catalog-container" id="product-grid"></main>

<div class="cart-overlay" id="cart-modal">
<div class="cart-modal">
<div class="cart-header"><h3>Tu Carrito</h3><button class="close-cart" onclick="toggleCart()">&times;</button></div>
<div class="cart-items" id="cart-items-container"></div>
<div class="cart-footer">
<div class="cart-total"><span>Total:</span><span id="cart-total-price">$0</span></div>
<form class="checkout-form" onsubmit="sendOrderToWhatsApp(event)">
<input type="text" id="cust-name" placeholder="Tu Nombre" required>
<input type="text" id="cust-address" placeholder="Dirección / Ciudad" required>
<button type="submit" class="send-whatsapp-btn"><i class="fa-brands fa-whatsapp"></i> Pedir por WhatsApp</button>
</form>
</div>
</div>
</div>

<button class="recommendations-btn" id="toggle-chat-btn"><i class="fa-solid fa-wand-magic-sparkles"></i> <i class="fa-solid fa-bag-shopping"></i> Asesor ZETTA</button>

<div class="chat-window" id="chat-window">
<div class="chat-header" style="padding:12px;background:var(--card-bg);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-color);">
  <span style="font-weight:600;color:var(--primary);"><i class="fa-solid fa-wand-magic-sparkles"></i> Asesor IA ZETTA</span>
  <button class="close-cart" id="close-chat-btn">&times;</button>
</div>
<div class="chat-body" id="chat-body">
  <div class="msg msg-bot">¡Hola! Qué gusto saludarte en ZETTA 🤝✨ Soy tu asesor experto en perfumería. Cuéntame, ¿buscas algo para hombre, mujer o unisex? ¡Te ayudaré a elegir la ideal!</div>
</div>
<div class="chat-footer-box">
<input type="text" class="chat-input" id="chat-input" placeholder="Ej: Busco un perfume de hombre...">
<button class="chat-send-btn" id="send-chat-btn"><i class="fa-solid fa-paper-plane"></i></button>
</div>
</div>

<script>
const STORE_CONFIG = { name: "ZETTA PERFUM'S", whatsappNumber: "573052953417", currencySymbol: "$" };
const CATALOG_URL = "https://script.google.com/macros/s/AKfycbzqoGiONu3DTfMzvfJQbpBzbXI9iIBwMYSMsPCrnpbnp8UtRH5k2VTxGxCFySUEfS8/exec"; 

let products = [];
let categories = ["Todos"], cart = [], currentCategory = "Todos";

function initStore() {
  renderCategories(); 
  tryFetchCatalog();
}

async function tryFetchCatalog() {
  try {
    const response = await fetch(CATALOG_URL);
    const data = await response.json();
    if (data && data.length > 0) {
      products = data.map((item, index) => ({
        id: index + 1, 
        title: item.title || item.titulo || item.nombre || "Perfume Zetta", 
        category: item.category ? item.category.trim().toLowerCase() : "clasicos",
        price: Number(item.price || item.precio) || 90000, 
        desc: item.desc || item.descripcion || "Fragancia exclusiva de alta duración", 
        gender: (item.gender || item.genero || "unisex").trim().toLowerCase(),
        icon: "✨", 
        image: item.image || item.Img || item.imagen || ""
      }));
      categories = ["Todos", ...new Set(products.map(p => p.category))];
      renderCategories(); 
      renderProducts();
    }
  } catch (e) {
    console.log("Error al cargar la red.");
  } finally {
    // OCULTAR LA PANTALLA DE CARGA CON EL LOGO CUANDO TERMINA (ÉXITO O FALLO)
    const splash = document.getElementById("splash-screen");
    if(splash) {
      splash.classList.add("fade-out");
    }
  }
}

function formatMoney(a){return STORE_CONFIG.currencySymbol + Number(a).toLocaleString('es-CO');}

function toggleCategoryMenu() {
  document.getElementById("categories-dropdown").classList.toggle("show");
}

window.onclick = function(event) {
  if (!event.target.matches('.menu-toggle-btn') && !event.target.closest('.menu-toggle-btn')) {
    const dropdown = document.getElementById("categories-dropdown");
    if (dropdown && dropdown.classList.contains('show')) {
      dropdown.classList.remove('show');
    }
  }
}

function renderCategories(){ 
  document.getElementById("current-cat-label").innerText = `(${currentCategory})`;
  document.getElementById("categories-dropdown").innerHTML = categories.map(c => `
    <button class="cat-item-btn ${c === currentCategory ? 'active' : ''}" onclick="filterCategory('${c}')">
      ${c.toUpperCase()}
    </button>`).join(''); 
}

function filterCategory(c){ 
  currentCategory = c; 
  renderCategories(); 
  renderProducts(); 
  document.getElementById("categories-dropdown").classList.remove('show');
}

function renderProducts(){
  const f = currentCategory === "Todos" ? products : products.filter(p => p.category === currentCategory);
  document.getElementById("product-grid").innerHTML = f.map(p => `
    <div class="product-card" id="prod-${p.id}">
      <div class="product-img-container">${p.image ? `<img src="${p.image.trim()}" alt="${p.title}">` : `<span style="font-size:3.5rem;">${p.icon}</span>`}</div>
      <div class="product-info">
        <div class="product-meta-top">
          <span class="product-category">${p.category}</span>
          ${p.gender ? `<span class="product-gender">${p.gender}</span>` : ''}
        </div>
        <h3 class="product-title">${p.title}</h3>
        <p class="product-desc">${p.desc}</p>
        <div class="product-price">${formatMoney(p.price)}</div>
        <button class="add-to-cart-btn" onclick="addToCart(${p.id})">Agregar</button>
      </div>
    </div>`).join('');
}

function addToCart(id){
  const ex = cart.find(i => i.id === id);
  if(ex){ ex.quantity += 1; } else { cart.push({...products.find(p => p.id === id), quantity: 1}); }
  updateCartUI();
}

function viewProductInCatalog(id) {
  document.getElementById("chat-window").classList.remove("active");
  const prod = products.find(p => p.id === id);
  if(prod && currentCategory !== "Todos" && currentCategory !== prod.category) {
    filterCategory(prod.category);
  }
  setTimeout(() => {
    const card = document.getElementById(`prod-${id}`);
    if(card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('highlight');
      setTimeout(() => card.classList.remove('highlight'), 2500);
    }
  }, 200);
}

function updateCartUI(){
  document.getElementById("cart-count").innerText = cart.reduce((s, i) => s + i.quantity, 0);
  document.getElementById("cart-total-price").innerText = formatMoney(cart.reduce((s, i) => s + (i.price * i.quantity), 0));
  document.getElementById("cart-items-container").innerHTML = cart.map(i => `
    <div class="cart-item">
      <div class="cart-item-icon">${i.image ? `<img src="${i.image.trim()}">` : i.icon}</div>
      <div class="cart-item-details">
        <div class="cart-item-title">${i.title}</div>
        <div class="qty-controls"><button class="qty-btn" onclick="changeQty(${i.id},-1)">-</button> <span>${i.quantity}</span> <button class="qty-btn" onclick="changeQty(${i.id},1)">+</button></div>
      </div>
      <button class="delete-item" onclick="removeItem(${i.id})"><i class="fa-solid fa-trash"></i></button>
    </div>`).join('');
}

function changeQty(id, d){ const it = cart.find(i => i.id === id); if(it){ it.quantity += d; if(it.quantity <= 0) cart = cart.filter(i => i.id !== id); updateCartUI(); } }
function removeItem(id){ cart = cart.filter(i => i.id !== id); updateCartUI(); }
function toggleCart(){ document.getElementById("cart-modal").classList.toggle("open"); }
function sendOrderToWhatsApp(e){
  e.preventDefault();
  const t = `*PEDIDO ZETTA*\nCliente: ${document.getElementById("cust-name").value}\n` + cart.map((i,x) => `${x+1}. ${i.title} x${i.quantity}`).join('\n');
  window.open(`https://wa.me/${STORE_CONFIG.whatsappNumber}?text=` + encodeURIComponent(t), '_blank');
}

document.getElementById("toggle-chat-btn").onclick = () => document.getElementById("chat-window").classList.toggle("active");
document.getElementById("close-chat-btn").onclick = () => document.getElementById("chat-window").classList.remove("active");

function processAIChat() {
  const inputElem = document.getElementById("chat-input");
  const text = inputElem.value.trim();
  if(!text) return;

  const chatBody = document.getElementById("chat-body");
  chatBody.innerHTML += `<div class="msg msg-user">${text}</div>`;
  inputElem.value = "";
  chatBody.scrollTop = chatBody.scrollHeight;

  const typingId = "typing-" + Date.now();
  chatBody.innerHTML += `<div class="msg msg-bot" id="${typingId}">Analizando perfil y género de fragancias... ✨</div>`;
  chatBody.scrollTop = chatBody.scrollHeight;

  setTimeout(() => {
    const typingElement = document.getElementById(typingId);
    if(typingElement) typingElement.remove();

    const query = text.toLowerCase();
    const isMan = query.includes("hombre") || query.includes("caballero") || query.includes("masculino");
    const isWoman = query.includes("mujer") || query.includes("dama") || query.includes("femenina");
    const isUnisex = query.includes("unisex");

    let scoredProducts = products.map(prod => {
      let score = 0;
      const g = (prod.gender || "").toLowerCase();
      const searchableText = `${prod.title} ${prod.desc} ${prod.category} ${g}`.toLowerCase();

      if (isMan && g.includes("hombre")) score += 20;
      if (isWoman && g.includes("mujer")) score += 20;
      if (isUnisex && g.includes("unisex")) score += 20;
      if (searchableText.includes(query)) score += 5;

      return { product: prod, score: score };
    });

    scoredProducts.sort((a, b) => b.score - a.score);

    let bestMatches = scoredProducts.filter(item => item.score > 0).map(item => item.product);
    if (bestMatches.length === 0) {
      bestMatches = products.slice(0, 3);
    } else {
      bestMatches = bestMatches.slice(0, 3);
    }

    let botReply = `¡Excelente elección! Buscando opciones para "${text}", estas son las fragancias ideales que tenemos disponibles:`;
    
    let cardsHtml = "";
    bestMatches.forEach(prod => {
      let thumb = prod.image ? `<img src="${prod.image.trim()}" alt="${prod.title}">` : `<div class="cp-icon">${prod.icon}</div>`;
      cardsHtml += `
        <div class="chat-product-card">
          ${thumb}
          <div class="chat-product-info">
            <h4>${prod.title} <span style="font-size:0.65rem; background:linear-gradient(270deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:bold;">(${prod.gender || 'unisex'})</span></h4>
            <p>${formatMoney(prod.price)}</p>
            <span style="font-size:0.68rem; color:var(--text-muted); display:block; margin-top:2px;">${prod.desc}</span>
          </div>
          <div class="chat-card-actions">
            <button class="btn-chat-view" onclick="viewProductInCatalog(${prod.id})">Ver</button>
            <button class="btn-chat-add" onclick="addToCart(${prod.id})">Agregar</button>
          </div>
        </div>`;
    });

    chatBody.innerHTML += `<div class="msg msg-bot">${botReply}${cardsHtml}</div>`;
    chatBody.scrollTop = chatBody.scrollHeight;
  }, 400);
}

document.getElementById("send-chat-btn").onclick = processAIChat;
document.getElementById("chat-input").onkeypress = (e) => { if(e.key === "Enter") processAIChat(); };

initStore();

setInterval(() => {
  document.querySelectorAll('iframe, a, div').forEach(el => {
    if ((el.src && el.src.includes('netlify')) || (el.innerText && el.innerText.includes('Powered by Netlify'))) {
      el.remove();
    }
  });
}, 300);
</script>
